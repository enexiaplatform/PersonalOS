<!doctype html><html lang="vi" data-theme="nocturne" data-density="normal"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Platform</title><link rel="icon" href="./henry-os-mark.png"><link rel="stylesheet" href="./tokens.css?v=system-3"><link rel="stylesheet" href="./design-system/patterns/enexia.css"><link rel="stylesheet" href="./design-system/components.css?v=system-3"></head><body><aside><div class="domain"><h2>Enexia</h2></div><nav id="side" aria-label="Điều hướng Enexia"></nav><div class="aside-foot">Personal Platform / Private workspace<br><a id="notion-side" target="_blank" rel="noopener">Mở nguồn Notion ↗</a></div></aside><main><div class="toolbar enexia-toolbar"><div class="actions"><span class="syncstamp" id="stamp"></span><button type="button" class="btn" id="reload"><span aria-hidden="true">↻</span> Tải lại</button><a class="btn" id="notion-main" target="_blank" rel="noopener">Notion</a></div></div><select class="mobile-select" id="mobile" aria-label="Chọn trang Enexia" disabled></select><p id="message" role="status"></p><section id="content" aria-live="polite"><div class="empty">Đang đọc dữ liệu Enexia…</div></section></main><dialog id="detail" aria-labelledby="enexia-detail-title"><button class="close" aria-label="Đóng">×</button><div id="detail-body"></div></dialog><script type="module">
import {icon} from "./experience.mjs";
const tabs=[['overview','review','Tổng quan'],['weekly','calendar','Kế hoạch tuần'],['gantt','gantt','Lộ trình'],['products','bag','Sản phẩm'],['ecosystem','layers','Hệ sinh thái'],['validation','target','Kiểm chứng']];
const colors={Memoire:'var(--sys-series-enexia)',Helm:'var(--sys-series-language)',Sentinel:'var(--sys-series-servicebio)',Forge:'var(--sys-series-ventures)',Flow:'var(--sys-series-neutral)',Platform:'var(--sys-series-language)'};let data=null,view='overview',filter='all',search='',span=14,offset=0;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=u=>/^https:\/\/(app\.notion\.com|www\.notion\.so|github\.com|[^/]+\.vercel\.app|www\.memoire-official\.com)(\/|$)/.test(u||'')?esc(u):'#';
const link=(u,t,cls='')=>'<a class="'+cls+'" href="'+safe(u)+'" target="_blank" rel="noopener noreferrer">'+esc(t)+' ↗</a>';const pill=(t,c='')=>'<span class="pill '+c+'">'+esc(t)+'</span>';const date=d=>new Date(d).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',timeZone:'Asia/Ho_Chi_Minh'});const selected=()=>data.products.filter(p=>(filter==='all'||p.Name===filter)&&(!search||JSON.stringify(p).toLowerCase().includes(search.toLowerCase())));const chosen=a=>a.filter(p=>filter==='all'||(p.Product||p.Name)===filter);const head=title=>'<header class="heading"><h1>'+title+'</h1></header>';
const opts=()=>'<option value="all">Tất cả sản phẩm</option>'+data.products.map(p=>'<option '+(filter===p.Name?'selected':'')+'>'+esc(p.Name)+'</option>').join('');const filters=()=>'<div class="filters"><label>Tìm sản phẩm<input id="search" placeholder="Tên sản phẩm, gate hoặc bằng chứng…" value="'+esc(search)+'"></label><label>Sản phẩm<select id="product-filter">'+opts()+'</select></label></div>';
const productCard=p=>'<button class="product-card" style="--product:'+colors[p.Name]+'" data-product="'+esc(p.Name)+'"><h3>'+esc(p.Name)+'</h3><p>'+esc(p.Role)+'</p>'+pill(p.Stage,p.Stage==='Concept'?'gray':p.Stage==='Demo / partial'?'warn':'')+'<small>'+(p.Repo?'Repo đã xác minh':'Roadmap / chưa xác minh repo')+' · Chi tiết ↗</small></button>';
function overview(){
 const counts=[...new Set(data.products.map(p=>p.Stage||'Chưa rõ'))].map(stage=>[stage,data.products.filter(p=>(p.Stage||'Chưa rõ')===stage).length]);
 const max=Math.max(1,...counts.map(([,n])=>n));
 const done=data.milestones.filter(m=>m.Status==='verified_done').length;
 const planned=data.milestones.filter(m=>m.Status==='plan').length;
 const stageBars=counts.map(([stage,n])=>'<button class="chartrow" data-stage="'+esc(stage)+'"><span>'+esc(stage)+'</span><span class="track" aria-hidden="true"><i style="width:'+n/max*100+'%;background:var(--sys-domain-enexia)"></i></span><strong>'+n+'</strong></button>').join('');
 const sourceRows=data.products.map(p=>{
  const release=data.deployments.find(d=>d.name===p.Name.toLowerCase());
  return '<tr><td><button data-product="'+esc(p.Name)+'">'+esc(p.Name)+'</button></td><td>'+pill(p.Stage||'Chưa rõ')+'</td><td>'+esc(release?.state||'—')+'</td><td>'+esc(p['Next Gate']||'—')+'</td></tr>';
 }).join('');
 return head('Tổng quan')+
  '<div class="enexia-summary"><div><b>'+data.products.length+'</b><span>Sản phẩm</span></div><div><b>'+done+'</b><span>Mốc đã xác minh</span></div><div><b>'+planned+'</b><span>Mốc theo kế hoạch</span></div><div><b>'+data.deployments.filter(d=>d.state==='READY'&&data.products.some(p=>p.Name.toLowerCase()===d.name)).length+'</b><span>Deployment READY</span></div></div>'+
  '<div class="enexia-overview"><section class="panel"><div class="panel-head"><h2>Danh mục sản phẩm</h2><a href="#products">Mở danh mục</a></div><div class="table-scroll" role="region" tabindex="0" aria-label="Bảng sản phẩm"><table class="data-table"><thead><tr><th scope="col">Sản phẩm</th><th scope="col">Giai đoạn</th><th scope="col">Deployment</th><th scope="col">Bước tiếp theo</th></tr></thead><tbody>'+(sourceRows||'<tr><td colspan="4">Chưa có sản phẩm trong snapshot.</td></tr>')+'</tbody></table></div></section>'+
  '<section class="panel"><div class="panel-head"><h2>Sản phẩm theo giai đoạn</h2></div>'+(stageBars||'<p class="sub">Chưa có dữ liệu giai đoạn.</p>')+'</section></div>'+
  '<details class="enexia-notes"><summary>Nguồn và phạm vi</summary><p>Notion là nguồn kế hoạch. Các trạng thái deployment lấy từ Vercel. Snapshot chưa có số người dùng, doanh thu hoặc thời gian đầu tư đã xác minh.</p></details>';
}
function ecosystem(){const node=(x,y,n,sub,w=210)=>'<g class="node" data-product="'+n+'" tabindex="0" role="button" aria-label="'+n+' '+sub+' · Xem chi tiết"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="76" rx="12"/><circle cx="'+(x+22)+'" cy="'+(y+24)+'" r="4" fill="'+colors[n]+'"/><text x="'+(x+36)+'" y="'+(y+29)+'" font-size="16" fill="var(--sys-fg-primary)">'+n+'</text> <text x="'+(x+20)+'" y="'+(y+54)+'" font-size="12" fill="var(--sys-fg-secondary)">'+sub+'</text></g>';return head('Hệ sinh thái','Bản đồ kiến trúc đã định hướng; đường nối chưa chứng minh kết nối production.')+'<section class="panel"><div class="ecosystem-map-scroll" role="region" tabindex="0" aria-label="Bản đồ hệ sinh thái · cuộn ngang để xem toàn bộ"><svg class="map" viewBox="0 0 920 430" role="group" aria-label="Memoire cung cấp commercial truth cho Helm; Sentinel cung cấp tín hiệu; Helm chuyển quyết định tới Forge, outcome quay lại Helm"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="var(--sys-fg-accent)"/></marker></defs><g fill="none" stroke="var(--sys-fg-accent)" stroke-width="1.4" marker-end="url(#arrow)"><path d="M250 105H350Q370 105 370 135V174"/><path d="M250 310H350Q370 310 370 280V250"/><path d="M570 210H660"/><path d="M760 250V320H480Q460 320 460 300V250" stroke-dasharray="5 4"/></g><g fill="var(--sys-fg-secondary)" font-size="10"><text x="274" y="89">Commercial truth</text><text x="271" y="336">Signal / impact</text><text x="580" y="196">Decision</text><text x="527" y="342">Verified outcome / learning</text></g>'+node(40,65,'Memoire','Commercial execution')+node(40,270,'Sentinel','External sensing')+node(360,174,'Helm','Management & decision core')+node(660,174,'Forge','Commitment & outcome')+node(660,60,'Flow','Roadmap / scope chưa chốt')+'</svg></div><div class="banner">Mũi tên thể hiện contract / vai trò kiến trúc. Trạng thái runtime và môi trường dùng thật được theo dõi riêng ở Products.</div></section><div class="relationship"><section class="panel"><h2>Shared foundation</h2><p>Identity, organization, quyền hạn và semantic model được định hướng dùng chung qua Helm.</p></section><section class="panel"><h2>Product boundaries</h2><p>Mỗi thành phần giữ vai trò và nguồn dữ liệu riêng; không đánh đồng dữ liệu commercial với quyết định quản trị.</p></section><section class="panel"><h2>Production gate</h2><p>Migrations, services, quyền hạn và dữ liệu thật cần được xác minh trên môi trường triển khai.</p></section></div>'}
function products(){return head('Danh mục sản phẩm','Mỗi tài sản có vai trò, nguồn và gate tiếp theo.')+filters()+'<section class="panel table-scroll"><table class="data-table"><thead><tr><th>Sản phẩm</th><th>Giai đoạn từ nguồn</th><th>Deployment</th><th>Gate tiếp theo</th><th>Nguồn</th></tr></thead><tbody>'+selected().map(p=>{const d=data.deployments.find(d=>d.name===p.Name.toLowerCase());return '<tr><td><button data-product="'+p.Name+'">'+p.Name+' →</button><span class="desc">'+esc(p.Role)+'</span></td><td>'+pill(p.Stage,p.Stage==='Demo / partial'?'warn':'')+'</td><td>'+pill(d?.state||'Chưa xác minh',d?'good':'gray')+'<span class="desc">'+(d?'Runtime chưa kiểm chứng':'Roadmap')+'</span></td><td style="max-width:290px;font-weight:400">'+esc(p['Next Gate'])+'</td><td>'+link(p.url,'Notion')+(p.App?'<br>'+link(p.App,'Mở app'):'')+'</td></tr>'}).join('')+'</tbody></table></section><p class="note">READY xác nhận artifact triển khai trên Vercel. Beta / kernel / demo là phân loại theo README, không thay thế pilot hoặc audit runtime.</p>'}
function gantt(){const ms=chosen(data.milestones),dated=ms.filter(m=>m['date:Date:start']),undated=ms.filter(m=>!m['date:Date:start']);const origin=new Date((data.weekly.start||data.readAt.slice(0,10))+'T00:00:00Z');origin.setUTCDate(origin.getUTCDate()+offset);const end=new Date(+origin+(span-1)*864e5);const axis=Array.from({length:span},(_,i)=>new Date(+origin+i*864e5));const pos=s=>(Date.parse(s)-origin)/864e5/span*100;return head('Gantt Pro','Mốc có ngày nằm trên timeline. Gate chưa chốt ngày nằm trong hàng đợi riêng.')+'<div class="filters"><label>Sản phẩm<select id="product-filter">'+opts()+'</select></label><button class="btn" data-range="prev">← Trước</button><button class="btn" data-range="today">Về tuần trong snapshot</button><button class="btn" data-range="next">Sau →</button><label for="zoom">Khung nhìn</label><select id="zoom"><option value="14" '+(span===14?'selected':'')+'>2 tuần</option><option value="35" '+(span===35?'selected':'')+'>5 tuần</option></select><span class="pill gray">'+date(origin)+' — '+date(end)+'</span></div><div class="gantt-shell" role="region" tabindex="0" aria-label="Lộ trình Enexia · cuộn ngang để xem toàn bộ"><div class="gantt" style="--days:'+span+'"><div class="ghead"><div class="glabel">SẢN PHẨM / MILESTONE</div><div class="gaxis">'+axis.map(d=>'<span>'+d.getUTCDate()+'/'+(d.getUTCMonth()+1)+'</span>').join('')+'</div></div>'+dated.map(m=>{let start=pos(m['date:Date:start']),finish=pos(m['date:Date:end']||m['date:Date:start']),valid=start>=0&&start<100;let id=data.milestones.indexOf(m);return '<div class="grow"><div class="glabel"><i class="dot" style="background:'+colors[m.Product]+'"></i><div>'+esc(m.Name)+'<small>'+m.Product+' · '+m.Status+'</small></div></div><div class="gtrack">'+(m['date:Date:end']&&finish>start?'<button class="gbar" data-milestone="'+id+'" style="left:'+Math.max(0,start)+'%;width:'+Math.max(0,Math.min(100,finish)-Math.max(0,start)+100/span)+'%" aria-label="'+esc(m.Name)+'">'+esc(m.Name)+'</button>':valid?'<button class="gmark" data-milestone="'+id+'" style="left:'+(start+50/span)+'%" aria-label="'+esc(m.Name)+' · '+date(m['date:Date:start'])+'"></button>':'<span class="gcaption">Ngoài khung nhìn · '+date(m['date:Date:start'])+'</span>')+'</div></div>'}).join('')+'</div></div><p class="note">◆ Mốc đơn ngày · thanh ngang chỉ xuất hiện khi nguồn có khoảng ngày. Những mốc kiểm kê chỉ xác nhận đã đọc tài liệu.</p><details class="undated" open><summary>Gate chưa lên lịch · '+undated.length+' bản ghi</summary>'+undated.map(m=>'<section class="gate-card"><div class="panel-head">'+pill(m.Product)+' '+pill(m.Status,'gray')+'</div><h2>'+esc(m.Name)+'</h2><p>Phụ thuộc: '+esc(m.Dependency||'Chưa xác định')+'</p>'+link(m.url,'Chốt ngày / xem bằng chứng trong Notion')+'</section>').join('')+'</details>'}
function validation(){return head('Kiểm chứng','Thử nghiệm là đề xuất cho đến khi có nguồn lực, người tham gia và tiêu chí được chốt.')+'<div class="metrics"><div class="metric"><small>EXPERIMENTS</small><b>'+data.validation.length+'</b><p>Đề xuất được lưu tại Notion</p></div><div class="metric"><small>VERIFIED RESULTS</small><b>'+data.validation.filter(v=>v.Status==='verified_done').length+'</b><p>Chỉ đếm kết quả xác minh</p></div><div class="metric"><small>PAID CUSTOMERS</small><b>—</b><p>Chưa có dữ liệu</p></div><div class="metric"><small>RETENTION</small><b>—</b><p>Chưa có baseline</p></div></div><div class="validation-grid">'+data.validation.map(v=>'<section class="panel"><div class="panel-head">'+pill(v.Product)+' '+pill(v.Status,'gray')+'</div><h2>'+esc(v.Name)+'</h2><div class="section-label">GIẢ THUYẾT</div><p class="note">'+esc(v.Hypothesis)+'</p><div class="section-label">BẰNG CHỨNG CẦN ĐẠT</div><p class="note">'+esc(v['Success Criteria'])+'</p><div class="section-label">KẾT QUẢ / QUYẾT ĐỊNH</div><p class="note">'+esc(v.Result||'Chưa có kết quả')+' · '+esc(v.Decision)+'</p>'+link(v.url,'Mở experiment','btn')+'</section>').join('')+'</div>'}
function weekly(){return head('Kế hoạch tuần')+'<div class="week"><span class="eyebrow">WEEK / '+date(data.weekly.start)+' — '+date(data.weekly.end)+'</span><h2>Kế hoạch tuần</h2><p>'+esc(data.weekly.note)+'</p>'+link(data.weekly.planner,'Mở Weekly Planner nguồn')+'</div><div class="grid"><section class="panel"><h2>Must-Win outcomes</h2><p class="sub">Tối đa 3 · chỉ hiển thị khi được chốt trong Weekly Planner</p><div class="empty">'+(data.weekly.outcomes.length?data.weekly.outcomes.map(esc).join(' · '):'Chưa có outcome Enexia được ghi nhận trong snapshot.')+'</div><p class="note">Gate ở backlog không tự biến thành nhiệm vụ tuần. Phân bổ giờ trong planner trước khi kích hoạt.</p>'+link(data.weekly.url,'Mở Weekly Focus','btn')+'</section><section class="panel"><h2>3 điểm nghẽn cần giữ trong tầm nhìn</h2><div class="queue">'+['Thiếu bằng chứng người dùng nhận giá trị lặp lại.','Staging, migrations và luồng production chưa chứng minh đầy đủ.','Nguồn lực cần cân bằng với các ưu tiên đã chốt.'].map((s,i)=>'<button data-weekly><span class="index">0'+(i+1)+'</span><b>'+s+'</b></button>').join('')+'</div></section><section class="panel wide"><h2>Stop / defer</h2><p class="note">Flow implementation · thêm tính năng trước khi kiểm chứng core loop · tự gán % hoặc doanh thu thiếu dữ liệu.</p><div class="steps"><div><span class="eyebrow">01 / CHỌN</span><h3>Chọn outcome</h3><p>Từ gate sản phẩm và nhu cầu thật.</p></div><div><span class="eyebrow">02 / PHÂN BỔ</span><h3>Giờ, ngày và buffer</h3><p>Ghi ở Weekly Planner đúng tuần.</p></div><div><span class="eyebrow">03 / REVIEW</span><h3>Outcome + evidence</h3><p>Chốt quyết định và bước tiếp theo.</p></div></div></section></div>'}
function showProduct(n){const p=data.products.find(p=>p.Name===n);if(!p)return;const d=data.deployments.find(d=>d.name===n.toLowerCase());openDetail('<span class="eyebrow">ENEXIA / PRODUCT</span><h2>'+esc(n)+'</h2><p>'+esc(p.Role)+'</p>'+pill(p.Stage)+'<div class="section-label">ĐÃ BIẾT TỪ NGUỒN</div><p>'+esc(p['Evidence Notes'])+'</p><div class="section-label">GATE TIẾP THEO</div><p>'+esc(p['Next Gate'])+'</p><div class="section-label">DEPLOYMENT</div><p>'+(d?esc(d.state)+' · Vercel metadata đã đọc. Chưa xác minh runtime, dữ liệu hoặc quyền truy cập.':'Chưa xác minh deployment.')+'</p><div class="links">'+link(p.url,'Notion','btn primary')+(p.Repo?link(p.Repo,'Repository','btn'):'')+(p.Evidence?link(p.Evidence,'README','btn'):'')+(p.App?link(p.App,'Mở app','btn'):'')+'</div>')}
function openDetail(html){document.querySelector('#detail-body').innerHTML=html;document.querySelector('#detail-body h2')?.setAttribute('id','enexia-detail-title');document.querySelector('#detail').showModal()}
function render(){if(!data)return;view=tabs.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):'overview';document.querySelector('#side').innerHTML=tabs.map(([id,glyph,title])=>'<button type="button" class="'+(view===id?'active':'')+'" data-view="'+id+'" '+(view===id?'aria-current="page"':'')+'>'+icon(glyph)+title+'</button>').join('');document.querySelector('#mobile').innerHTML=tabs.map(([id,i,t])=>'<option value="'+id+'" '+(id===view?'selected':'')+'>'+t+'</option>').join('');document.querySelector('#content').innerHTML=({overview,ecosystem,products,gantt,validation,weekly})[view]();for(const id of ['notion-side','notion-main'])document.getElementById(id).href=data.sourceUrl;const stale=Date.now()-Date.parse(data.readAt)>864e5;document.querySelector('#stamp').textContent=(stale?'Snapshot cũ · ':'Snapshot · ')+date(data.readAt);document.querySelector('#stamp').title='Đọc từ Notion: '+new Date(data.readAt).toLocaleString('vi-VN')+'. Tải snapshot chỉ đọc bản đã đồng bộ, không đọc Notion trực tiếp.';}
async function load(){const b=document.querySelector('#reload');b.disabled=true;try{const bridge=window.parent.PersonalOSModuleBridge;if(!bridge)throw Error('Mở Enexia từ Personal Platform để đọc snapshot.');const next=await bridge.read('enexia');if(next.version!==1||!Array.isArray(next.products))throw Error('Dữ liệu không hợp lệ');next.products.sort((a,b)=>['Memoire','Helm','Sentinel','Forge','Flow'].indexOf(a.Name)-['Memoire','Helm','Sentinel','Forge','Flow'].indexOf(b.Name));data=next;render();document.querySelector('#mobile').disabled=false;document.querySelector('#message').textContent='';}catch(e){if(data)document.querySelector('#message').textContent=e.message+' · Đang dùng snapshot trước.';else document.querySelector('#content').innerHTML='<div class="enexia-empty"><h1>Chưa đọc được dữ liệu Enexia</h1><p>'+esc(e.message)+'</p></div>';}finally{b.disabled=false}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-view],[data-product],[data-stage],[data-milestone],[data-range],[data-weekly]');if(!el)return;if(el.dataset.view){location.hash=el.dataset.view;return}if(el.dataset.product){showProduct(el.dataset.product);return}if(el.dataset.stage){const ps=data.products.filter(p=>(p.Stage||'Chưa rõ')===el.dataset.stage);openDetail('<span class="eyebrow">PRODUCT STAGE</span><h2>'+esc(el.dataset.stage)+'</h2><p>'+ps.length+' sản phẩm theo nguồn</p>'+ps.map(productCard).join(''));return}if(el.dataset.milestone!==undefined){const m=data.milestones[Number(el.dataset.milestone)];openDetail('<span class="eyebrow">MILESTONE / '+esc(m.Product)+'</span><h2>'+esc(m.Name)+'</h2>'+pill(m.Status)+'<p>'+esc(m.Outcome)+'</p><p>'+esc(m['date:Date:start']||'Chưa lên lịch')+'</p>'+link(m.url,'Mở Notion','btn primary'));return}if(el.dataset.range){offset=el.dataset.range==='today'?0:offset+(el.dataset.range==='prev'?-span:span);render()}if(el.hasAttribute('data-weekly'))window.open(data.weekly.url,'_blank','noopener')});
document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.matches('.node')){e.preventDefault();showProduct(e.target.dataset.product)}});document.querySelector('#detail .close').onclick=()=>document.querySelector('#detail').close();document.querySelector('#reload').onclick=load;document.querySelector('#mobile').onchange=e=>location.hash=e.target.value;document.addEventListener('change',e=>{if(e.target.id==='product-filter'){filter=e.target.value;render();document.querySelector('#product-filter').focus()}if(e.target.id==='zoom'){span=Number(e.target.value);render()}});document.addEventListener('input',e=>{if(e.target.id==='search'&&!e.isComposing){search=e.target.value;const pos=e.target.selectionStart;render();const inp=document.querySelector('#search');inp.focus();inp.setSelectionRange(pos,pos)}});addEventListener('hashchange',()=>{render();scrollTo(0,0)});load();
</script><script type="module">import {mountUI} from "./design-system/ui.mjs";mountUI();try{const apply=()=>document.documentElement.dataset.density=parent.document.documentElement.dataset.density||"normal";apply();parent.addEventListener("henry-density-change",apply);}catch{}</script></body></html>
